<style>
:root{--bg:#f6f1e7;--ink:#1d1d1b;--mute:#5d5a52;--rule:#d8d0bd;--olive:#4a5a34;--brick:#a2392b;--ochre:#b8872f;--card:#efe8d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b18;--ink:#efe9da;--mute:#b3ad9c;--rule:#3a392f;--olive:#a9bd86;--brick:#e08a7b;--ochre:#d9b05f;--card:#24241f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;line-height:1.12;margin:0}
h1{font-size:clamp(2.3rem,6.5vw,4.6rem)}h2{font-size:clamp(1.7rem,4vw,2.6rem)}h3{font-size:1.35rem}
a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brick);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}.read{max-width:62ch}
.eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:600}
.note{font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;color:var(--brick);transform:rotate(-2deg);display:inline-block}
header{border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{text-decoration:none;font-family:"DM Serif Display",serif;font-size:1.3rem}.brand b{color:var(--brick);font-weight:400}.brand small{display:block;font:600 .6rem Inter;letter-spacing:.18em;color:var(--olive)}
nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;align-items:center}nav a{text-decoration:none;font-size:.92rem}nav a:hover{color:var(--brick)}
.cta{border:1px solid var(--ink);padding:7px 16px;border-radius:99px}.cta:hover{background:var(--ink);color:var(--bg)!important}
#mb{display:none;background:none;border:1px solid var(--rule);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit}
@media(max-width:860px){#mb{display:block}nav ul{display:none;position:absolute;left:0;right:0;top:64px;background:var(--bg);flex-direction:column;align-items:flex-start;padding:16px 22px 24px;border-bottom:1px solid var(--rule);gap:14px}nav ul.open{display:flex}}
section{padding:72px 0;border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:7fr 5fr;gap:48px;align-items:center}@media(max-width:860px){.grid{grid-template-columns:1fr;gap:28px}}
.logo{height:56px;width:auto;display:block;mix-blend-mode:multiply}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .logo{background:#fff;mix-blend-mode:normal;padding:2px 6px;border-radius:3px}}
.btn{display:inline-block;padding:12px 22px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:2px;border:0;font:600 .95rem Inter;cursor:pointer;transition:background .2s}.btn:hover{background:var(--brick)}
.lnk{color:var(--brick);font-weight:500;margin-left:18px}
.list{list-style:none;margin:0;padding:0}.list a{display:grid;grid-template-columns:56px 1fr;gap:6px 14px;padding:22px 0;border-top:1px solid var(--rule);text-decoration:none}.list a:hover h3{color:var(--brick)}.list span{font-family:"DM Serif Display",serif;color:var(--ochre);font-size:1.5rem}.list p{margin:4px 0 0;color:var(--mute);grid-column:2}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--rule)}.steps div{padding:22px;border-right:1px solid var(--rule)}.steps b{color:var(--olive)}
.box{background:var(--card);border-left:4px solid var(--brick);padding:20px 24px;margin:32px 0;font-size:.95rem}
.ph{background:var(--card);border:1px dashed var(--rule);padding:28px;min-height:190px;color:var(--mute);font-size:.9rem}
img.pt{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;filter:saturate(.92);border-radius:2px}
ul.ticks{padding-left:1.1em}ul.ticks li{margin:.4em 0}ul.ticks li::marker{color:var(--olive)}
.crumb{font-size:.8rem;color:var(--mute);margin-bottom:26px}.crumb a{color:var(--mute)}
form{display:grid;gap:18px;max-width:640px}label,legend{font-weight:500;font-size:.9rem}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--mute);background:var(--bg);color:var(--ink);border-radius:2px}
fieldset{border:1px solid var(--rule);padding:12px 16px}fieldset label{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-weight:400}fieldset input{width:auto}
.err{color:var(--brick);font-size:.85rem;min-height:1em}[aria-invalid=true]{border-color:var(--brick)}
#st{padding:14px;border-left:4px solid var(--olive);background:var(--card);display:none}
footer{padding:56px 0 40px;font-size:.88rem;color:var(--mute)}footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px}footer a{display:block;margin:4px 0;text-decoration:none}footer a:hover{color:var(--brick)}
@media(prefers-reduced-motion:no-preference){main{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}}}

const P=[
{id:"business",n:"01",t:"Business",tag:"Strategy. Structure. New possibilities.",s:"Strategy, business models, restructuring support, new ventures and commercial partnerships.",intro:`Businesses evolve, markets change and circumstances shift. Sometimes an organisation needs a new direction; sometimes it needs to look more carefully at the model it already has. Jugaad Business helps businesses and entrepreneurs think through commercial challenges, assess opportunities and explore practical ways forward.`,l:["Business strategy and business-model evaluation","New ventures and business opportunities","Business transformation and restructuring support","Commercial partnerships and collaborations","Opportunity assessment and strategic planning","Connecting relevant business and industry expertise"],note:`The emphasis is on understanding the actual business situation before recommending a direction.`},
{id:"creative",n:"02",t:"Creative",tag:"Ideas need clarity. Stories need direction.",s:"Advertising, films, media, communication, storytelling and creative direction.",intro:`Creative communication is more than making something look attractive. It involves understanding the audience, the purpose, the context and the story that needs to be told. Drawing on experience in advertising, films, media and communication, Jugaad Creative supports assignments that need creative thinking and narrative direction.`,l:["Advertising and brand communication","Films and media projects","Creative strategy and campaign thinking","Storytelling and narrative development","Screenplay consultation","Concept development and creative direction","Communication for businesses, institutions and social initiatives"]},
{id:"production",n:"03",t:"Production",tag:"Good ideas need workable plans.",s:"Production planning, budgeting, cost analysis, resource planning and cost optimisation.",intro:`A production or project can become difficult when budgets, timelines, resources and expectations do not align. Jugaad Production focuses on the practical side of turning an idea into an executable plan.`,l:["Production planning","Budget review and cost estimates","Scope and resource planning","Cost optimisation","Production coordination","Commercial and vendor negotiation support","Reviewing feasibility and identifying practical alternatives"],note:`Professional execution is arranged according to the scope and requirements of each assignment.`},
{id:"legal",n:"04",t:"Legal & Resolution",tag:"When matters become complicated, clarity matters.",s:"Dispute-resolution strategy, case coordination and mediation support alongside qualified legal professionals.",intro:`Disputes and legal situations can involve several parties, documents, timelines, commercial considerations and procedural questions. Jugaad Legal & Resolution provides strategic coordination and problem-solving support around complicated matters.`,l:["Understanding the background and issues in a dispute","Dispute-resolution strategy","Case and document coordination","Mediation support","Stakeholder communication and coordination","Identifying suitable advocates, mediators or other professionals where required","Supporting structured discussions towards possible resolution"],warn:`Jugaad Advisory is not a law firm and does not provide legal representation or replace the advice of a qualified advocate. Legal opinions, representation and regulated legal services must be provided by appropriately qualified and authorised legal professionals. Our involvement is limited to the agreed advisory, coordination and resolution-support scope. No settlement or outcome is guaranteed.`},
{id:"realty",n:"05",t:"Realty",tag:"Property is not always just about property.",s:"Complex property opportunities, stalled or disputed assets, development concepts and transaction coordination.",intro:`Some real-estate situations are straightforward. Others involve complicated ownership histories, development possibilities, stakeholder interests, stalled projects or commercial and institutional considerations. Jugaad Realty focuses on understanding such situations and helping identify practical routes forward.`,l:["Complex property opportunities","Landowner–developer discussions","Stalled or disputed property situations","Development concepts and opportunity evaluation","Commercial and transaction coordination","Stakeholder discussions","Connecting relevant technical, legal and development professionals"],warn:`Jugaad Advisory is not a registered real-estate agent, RERA-registered broker or authorised investment adviser. Regulated work is carried out by appropriately qualified and authorised professionals.`},
{id:"connect-industry",n:"06",t:"Connect & Industry",tag:"The right conversation can open a different route.",s:"Institutional engagement, government liaison, stakeholder relationships, industry connections and international business introductions.",intro:`Some opportunities depend not only on what you know, but on whom you need to engage, what institutions are relevant and how a conversation should be approached. Jugaad Connect & Industry helps clients explore institutional, industry, business and stakeholder relationships in India and internationally.`,l:["Institutional and government liaison","Stakeholder engagement","Industry and business introductions","Manufacturing and technology partnerships","Exploring cross-border commercial opportunities","International business and institutional introductions","Supporting communication with relevant organisations and networks"],warn:`This is relationship-led access and facilitation. We do not hold or claim diplomatic or consular authority, government endorsement or guaranteed access. Introductions and liaison are not lobbying, influence-selling, approvals or guaranteed commercial results.`,more:"connect"},
{id:"earth",n:"07",t:"Earth & Agriculture",tag:"Development and ecology must be considered together.",s:"Agriculture, rural enterprise, farmer engagement, environmental initiatives and biodiversity projects.",intro:`Agriculture, rural enterprise and environmental sustainability are interconnected. Drawing on experience in farmer-focused communication, rural development and ecological initiatives, Jugaad Earth & Agriculture works around assignments that connect people, land, livelihoods and the environment.`,l:["Agricultural and rural enterprise models","Farmer engagement and communication","Agricultural knowledge and awareness initiatives","Rural development programmes","Environmental initiatives","Biodiversity and ecological projects","Institutional partnerships around agriculture and the environment"],note:`Relevant background includes work associated with Green TV India and ARDEAF Foundation (Agriculture Rural Development &amp; Environment Awareness Foundation). These are experience and associated initiatives, not services delivered directly by Jugaad Advisory on every project.`}];

const entries=()=>`<ul class="list">${P.map(p=>`<li><a href="#${p.id}"><span>${p.n}</span><h3>${p.t}</h3><p class="serif" style="color:var(--olive);font-size:1.1rem">${p.tag}</p><p>${p.s}</p><p style="font-size:.92rem"><b style="color:var(--ink);font-weight:500">Includes:</b> ${p.l.slice(0,3).join(" · ")}</p><p style="color:var(--brick);font-weight:500;font-size:.9rem">Read more →</p></a></li>`).join("")}</ul>`;

const MAP=`<svg viewBox="0 0 400 250" role="img" aria-label="Restrained map-style grid with a handwritten note: India and beyond" style="width:100%;height:auto;color:var(--olive)"><g fill="none" stroke="currentColor" stroke-width=".7" opacity=".5">${[0,1,2,3,4,5].map(i=>`<line x1="0" x2="400" y1="${20+i*42}" y2="${20+i*42}"/>`).join("")}${[0,1,2,3,4,5,6,7].map(i=>`<line y1="0" y2="250" x1="${25+i*50}" x2="${25+i*50}"/>`).join("")}</g><path d="M95 190 Q200 40 305 120" fill="none" stroke="var(--brick)" stroke-width="1.6" stroke-dasharray="4 5"/><circle cx="95" cy="190" r="5" fill="var(--brick)"/><circle cx="305" cy="120" r="5" fill="none" stroke="var(--brick)" stroke-width="1.6"/><text x="110" y="215" font-family="Bradley Hand,Segoe Print,cursive" font-size="17" fill="var(--brick)">India</text><text x="268" y="150" font-family="Bradley Hand,Segoe Print,cursive" font-size="17" fill="var(--brick)">and beyond</text></svg>`;
const V={
home:()=>`<section><div class="wrap grid"><div><div class="eyebrow">Independent. Founder-led. Solution-oriented.</div><h1 style="margin:16px 0 24px">Every problem is different.<br><span style="color:var(--brick)">Every solution should be too.</span></h1><p class="read">Some problems are straightforward. Others involve several moving parts, competing interests, unfamiliar territory or no obvious way forward.</p><p class="read">Jugaad Advisory works with businesses, entrepreneurs, institutions and individuals to understand their specific challenges, identify practical possibilities, bring relevant expertise together and help move things forward.</p><p><a class="btn" href="#practice">Explore What We Do</a><a class="lnk" href="#contact">Start a Conversation →</a></p></div>
<div><img class="pt" src="${PORTRAIT}" alt="Junaid Memon, founder of Jugaad Advisory, smiling and looking thoughtfully off-camera" width="835" height="1199"><p class="note" style="margin:10px 0 0">Fresh perspective. Practical experience. The right people around the table.</p></div></div></section>
<section><div class="wrap grid"><div><h2>Not every problem has a ready-made answer.</h2></div><div class="read"><p>There are situations where a standard consultant’s report is not enough. A business may need to rethink its model. A project may be stuck between different stakeholders. A property opportunity may involve complicated commercial or institutional considerations. A creative idea may need a viable production plan.</p><p>Sometimes the challenge is not a lack of ideas. It is knowing which direction to take, who needs to be involved and how to turn a possibility into something workable. That is where Jugaad Advisory comes in.</p></div></div></section>
<section><div class="wrap"><div class="eyebrow">What we bring to the table</div><h2 style="margin:10px 0 28px">Seven ways in.</h2>${entries()}</div></section>
<section><div class="wrap"><div class="eyebrow">How we think</div><h2 style="margin:10px 0 18px">Understand first. Solve second.</h2><p class="read">We do not begin with a predetermined package. We begin by understanding the situation: what is the actual problem, what has been tried, what is preventing progress, and what would a workable outcome look like?</p><div class="steps">${stages.map((s,i)=>`<div><b>0${i+1}</b><br>${s}</div>`).join("")}</div><p class="read" style="margin-top:22px">The solution must fit the problem — not the other way around.</p></div></section>
<section><div class="wrap grid"><div><h2>One practice. Different perspectives.</h2></div><div class="read"><p>Jugaad Advisory draws on experience across business, advertising, films, media, production, property, agriculture, rural development and environmental initiatives. Some assignments require one perspective. Others need several.</p><p>We work on a founder-led basis and bring in relevant specialists, professionals or associates when the assignment requires them. We do not believe in having an answer for everything. We believe in finding the right way to address each problem.</p></div></div></section>
<section><div class="wrap grid"><div><div class="eyebrow">Why Jugaad</div><h2 style="margin:10px 0">You may attend hundreds of seminars and webinars…</h2></div><div class="read"><p>…and gain ideas, insights and strategies for growth. But your problem is unique. It needs a personalised, customised solution, with someone to walk the journey with you.</p><p class="note" style="font-size:1.3rem">That’s where Jugaad Advisory comes on board.</p><p class="eyebrow">Practical thinking. Personalised solutions. Hand-holding through the process.</p></div></div></section>
<section style="background:var(--card)"><div class="wrap grid"><div><div class="eyebrow">India and beyond · International &amp; National Connect</div><h2 style="margin:10px 0 18px">Local understanding. Wider connections.</h2><p class="read">A business assignment, a creative project, a manufacturing partnership or an institutional initiative can all benefit from the right introductions. Within India and internationally, Jugaad Advisory helps clients identify relevant stakeholders, businesses, institutions and networks, and approach the conversation well.</p><p class="read">This is relationship-led engagement, not a promise of approvals, contracts or guaranteed outcomes. We do not represent governments or diplomatic missions.</p><a class="btn" href="#connect">Explore International &amp; National Connect</a></div><div>${MAP}</div></div></section>${cta}`,
about:()=>head("About","About Jugaad","A different way of looking at problems.",`Real-world problems rarely arrive in neat categories.`)+`<section><div class="wrap grid"><div class="read"><p>They may involve business decisions, commercial interests, people, property, institutions, creative thinking or practical execution — often all at once. Conventional solutions may not always address the actual situation.</p><p>Jugaad Advisory brings together independent thinking, practical experience and the ability to connect different areas of expertise around a specific challenge. It is an independent, founder-led practice, a brand of Guava Creative Solutions Private Limited.</p><h2 style="margin:36px 0 12px">What Jugaad means</h2><p>Jugaad is often understood as resourcefulness: finding a way forward when conventional routes are inadequate. Here it does not mean cutting corners, compromising ethics or taking shortcuts. It means a fresh perspective, recognising overlooked resources, bringing the right people together and finding a responsible, practical way forward.</p><p class="serif" style="font-size:1.5rem;color:var(--olive)">Jugaad is not about cutting corners. It is about finding a better way forward.</p><h2 style="margin:36px 0 12px">Our philosophy</h2><p>We value resourcefulness, clarity, responsibility and practical thinking. We are interested in what can genuinely be done — not just what sounds good in a presentation. Good advice should help someone understand their choices and take a considered next step.</p></div><div><img class="pt" src="${BOOK}" alt="Junaid Memon in orange-framed glasses and a light-blue linen shirt, with a crowded bookshelf behind him" loading="lazy" width="800" height="1067"></div></div></section>
<section><div class="wrap grid"><div><h2>Experience across different worlds.</h2><p class="note">A practical approach to solving problems.</p></div><div class="read"><p>Jugaad Advisory is founder-led by Junaid Memon, an entrepreneur whose journey has crossed advertising, filmmaking, media, business development, agriculture, rural communication and environmental initiatives.</p><p>His experience includes work through Crystal Communications, Nomad Films and Guava Creative Solutions, as well as Green TV India, a farmer-focused broadcasting initiative. He has also been associated with ARDEAF Foundation (Agriculture Rural Development &amp; Environment Awareness Foundation), focused on agriculture, rural development and environmental awareness.</p><p>The approach comes from this variety: understand the situation, look beyond the obvious, identify what is possible and bring the relevant people together. Assignments are approached individually, with specialists and associates involved where their experience is relevant.</p><div class="ph">Space reserved for a short founder’s note, to be written by Junaid Memon himself.</div></div></div></section>
<section><div class="wrap read"><h2>What we are not</h2><p>Jugaad Advisory is not a one-size-fits-all consultancy. It is not a law firm, engineering consultancy, architectural practice, investment bank or regulated brokerage. Where an assignment requires licensed, regulated or specialist services, those are provided by appropriately qualified and authorised professionals. Our role may involve strategy, coordination, problem-solving, evaluation, introductions and bringing the relevant people together.</p></div></section>${cta}`,
approach:()=>head("Approach","The Approach","The problem comes first. The solution follows.","Every assignment begins with understanding the circumstances, not selling a predetermined service.")+`<section><div class="wrap read">${[["Listen","We begin with the client’s account of the situation. What happened? What is the desired outcome? What has already been attempted? What constraints are involved?"],["Understand","We examine the underlying issues, the stakeholders, the practical limitations and the opportunities that may not be immediately visible."],["Explore","We identify possible approaches: business strategy, creative thinking, commercial evaluation, institutional engagement or specialist professional support."],["Connect","Where necessary, we identify relevant professionals, specialists, organisations, businesses or institutional contacts who may help advance the assignment."],["Move Forward","We help structure the next steps and, depending on the agreed scope, coordinate discussions and support progress."]].map((s,i)=>`<div style="border-top:1px solid var(--rule);padding:26px 0"><span class="serif" style="color:var(--ochre);font-size:1.6rem">0${i+1}</span> <h3 style="display:inline;margin-left:10px">${s[0]}</h3><p>${s[1]}</p></div>`).join("")}<div class="box">Not every assignment requires every stage. The scope and nature of our involvement depend on the specific situation.</div><h2>A note on practical solutions</h2><p>We do not promise that every problem can be solved or that every opportunity will succeed. We do believe that a better understanding of the problem, a wider view of the options and the right people at the right time can make a meaningful difference.</p></div></section>${cta}`,
practice:()=>head("Practice Areas","Practice Areas","Seven perspectives, one practice.","Some assignments sit in one area. Many draw on several.")+`<section><div class="wrap">${entries()}</div></section>${cta}`,
connect:()=>head("International & National Connect","Jugaad Connect & Industry","The right conversation can open a different route.","Some opportunities depend not only on what you know, but on whom you need to engage, which institutions are relevant and how a conversation should be approached.")+`<section><div class="wrap grid"><div class="read"><p>Jugaad Connect &amp; Industry helps clients navigate relationships across business, industry, government and institutions, in India and internationally.</p><p>Our work may involve identifying relevant stakeholders, facilitating introductions, exploring partnerships and supporting engagement with organisations that can help move an opportunity forward.</p></div><div>${MAP}<img class="pt" style="margin-top:20px;aspect-ratio:4/3;object-position:50% 25%" src="${WALL}" alt="Junaid Memon looking thoughtfully upward, in front of framed black-and-white photographs of Delhi monuments" loading="lazy" width="800" height="1067"></div></div></section>
<section><div class="wrap grid"><div><div class="eyebrow">National</div><h2 style="margin:10px 0">Business, Industry &amp; Institutional Connect</h2></div><div>${ul(["Business and industry relationships","Institutional introductions and engagement","Government liaison and stakeholder communication","Manufacturing and technology partnerships","Industry collaborations and commercial connections","Exploring opportunities involving businesses, institutions and public-sector stakeholders"])}</div></div></section>
<section><div class="wrap grid"><div><div class="eyebrow">International</div><h2 style="margin:10px 0 14px">International Business &amp; Diplomatic Connect</h2><p class="note">Connecting opportunities across borders.</p><p class="read">Drawing on an established international network across business, government, diplomatic missions and institutions, we can help clients explore cross-border opportunities, identify relevant contacts and facilitate introductions and institutional engagement in India and internationally.</p><p class="read">This can be valuable for organisations exploring new markets, international partnerships or institutional relationships, or simply trying to find the right people to start a conversation.</p></div><div><h3 style="margin-bottom:8px">Our role may include</h3>${ul(["Identifying relevant international business and institutional contacts","Facilitating introductions with appropriate business and industry representatives","Exploring India–international trade, investment and collaboration opportunities","Supporting engagement with diplomatic missions and institutional networks","Connecting organisations with relevant government, industry and business stakeholders","Helping initiate conversations around technology, manufacturing, commerce and strategic partnerships"])}</div></div>
<div class="wrap read"><p>The value is not simply in knowing people. It is in understanding which connections are relevant, how to approach them and what could emerge from the conversation.</p><div class="box"><b>Please note.</b> Our role is to facilitate appropriate introductions, communication and engagement. We do not represent governments or diplomatic missions, and we do not guarantee contracts, approvals, investments, licences or other outcomes. Introductions and liaison are not lobbying or influence-selling.</div><p class="serif" style="font-size:1.6rem;color:var(--olive)">Local understanding. Wider connections. International possibilities.</p></div></section>${cta}`,
insights:()=>head("Insights","Insights","Observations from the work.","An independent journal on strategy, creativity, property, institutions, agriculture and the environment.")+`<section><div class="wrap grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${["Business & strategy","Creative & communication","Agriculture & rural development"].map(c=>`<article class="ph"><div class="eyebrow">${c}</div><h3 style="margin:10px 0">Placeholder — article to come</h3><p>Layout only. No article has been published here yet.</p></article>`).join("")}</div></section>${cta}`,
contact:()=>head("Contact","Contact","Tell us what you are trying to solve.","You do not need to know which practice area your problem belongs to. Tell us about the situation, what you are trying to achieve and where you need help.")+`<section><div class="wrap grid"><form id="f" novalidate>
<div><label for="nm">Name</label><input id="nm" required autocomplete="name"><div class="err"></div></div>
<div><label for="em">Email</label><input id="em" type="email" required autocomplete="email"><div class="err"></div></div>
<div><label for="ph">Phone (optional)</label><input id="ph" type="tel" autocomplete="tel"></div>
<div><label for="og">Organisation (optional)</label><input id="og" autocomplete="organization"></div>
<div><label for="co">Country</label><input id="co" required autocomplete="country-name"><div class="err"></div></div>
<fieldset><legend>Area of interest (choose any)</legend>${P.map(p=>`<label><input type="checkbox" name="ar" value="${p.t}">${p.t}</label>`).join("")}<label><input type="checkbox" name="ar" value="Not sure yet">Not sure yet</label></fieldset>
<div><label for="ds">Brief description of the situation</label><textarea id="ds" rows="6" required></textarea><div class="err"></div></div>
<div><label for="pc">Preferred method of contact</label><select id="pc"><option>Email</option><option>Phone</option><option>WhatsApp</option></select></div>
<div><label style="font-weight:400"><input type="checkbox" id="cs" style="width:auto"> I agree that my details may be used to respond to this enquiry, as described in the <a href="#privacy">Privacy Policy</a>.</label><div class="err"></div></div>
<button class="btn" type="submit">Prepare my enquiry</button><div id="st" role="status" aria-live="polite"></div></form>
<aside><p class="eyebrow">Or reach us directly</p><p><a href="tel:+919820079484">${CFG.phone}</a><br><a href="https://wa.me/${CFG.wa}">WhatsApp</a><br><a href="mailto:${EMAIL}">${EMAIL}</a><br><a href="${CFG.linkedin}" rel="noopener">LinkedIn</a></p><p style="color:var(--mute);font-size:.9rem">Sending the form opens a pre-filled email in your own mail app. Nothing is sent until you press send there.</p></aside></div></section>`,
privacy:()=>head("Privacy","Privacy Policy","Privacy Policy","Starter text — to be reviewed by a qualified professional before launch.")+`<section><div class="wrap read"><p>Guava Creative Solutions Private Limited (Jugaad Advisory) collects only the details you choose to share through the contact form, email, phone or WhatsApp, and uses them solely to respond to your enquiry. We do not sell your information. Details are kept only as long as needed for that purpose and you may ask us to correct or delete them by writing to ${EMAIL}. This site does not currently use advertising trackers; if analytics are added, they will be privacy-conscious and described here.</p></div></section>`,
terms:()=>head("Terms","Terms of Use","Terms of Use","Starter text — to be reviewed by a qualified professional before launch.")+`<section><div class="wrap read"><p>This website provides general information about Jugaad Advisory and is not legal, financial or professional advice. Services are provided only within scopes and terms agreed in writing. Specialist and regulated services are provided by appropriately qualified and authorised professionals. No commercial, legal, institutional or regulatory outcome is guaranteed. Content is owned by Guava Creative Solutions Private Limited.</p></div></section>`};
P.forEach(p=>V[p.id]=()=>head(`<a href="#practice">Practice Areas</a> / ${p.t}`,`${p.n} — Jugaad ${p.t}`,p.tag,p.intro)+`<section><div class="wrap grid"><div><h2 style="margin-bottom:12px">Areas of engagement</h2>${ul(p.l)}${p.note?`<p class="note" style="margin-top:14px">${p.note}</p>`:""}</div><div class="ph">Image slot: documentary photograph for ${p.t}. Use a real, believable environment.</div></div>${p.warn?`<div class="wrap"><div class="box"><b>Please note.</b> ${p.warn}</div></div>`:""}${p.more?`<div class="wrap"><a class="lnk" style="margin:0" href="#connect">See National &amp; International Connect →</a></div>`:""}</section>${cta}`);
const TITLES={home:"Jugaad Advisory — The Problem Solver"};
function route(){const k=location.hash.slice(1)||"home",v=V[k]||V.home;$("#main").innerHTML=v();document.title=(TITLES[k]||(k[0].toUpperCase()+k.slice(1).replace(/-/g," ")+" — Jugaad Advisory"));
$("#menu").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");window.scrollTo(0,0);if(k=="contact")form();}
function form(){const f=$("#f");f.addEventListener("submit",e=>{e.preventDefault();let ok=true;
const chk=(id,msg,bad)=>{const el=$("#"+id),er=el.parentElement.querySelector(".err");const b=bad?bad(el):!el.value.trim();el.setAttribute("aria-invalid",b);if(er)er.textContent=b?msg:"";if(b)ok=false};
chk("nm","Please enter your name.");chk("em","Please enter a valid email address.",el=>!/^\S+@\S+\.\S+$/.test(el.value));chk("co","Please enter your country.");chk("ds","Please describe the situation briefly.");
const cs=$("#cs");cs.parentElement.parentElement.querySelector(".err").textContent=cs.checked?"":"Please tick to consent.";if(!cs.checked)ok=false;
const st=$("#st");st.style.display="block";if(!ok){st.textContent="Please correct the highlighted fields.";st.style.borderColor="var(--brick)";return}
const ar=[...document.querySelectorAll("[name=ar]:checked")].map(x=>x.value).join(", ")||"Not specified";
const body=`Name: ${$("#nm").value}\nEmail: ${$("#em").value}\nPhone: ${$("#ph").value}\nOrganisation: ${$("#og").value}\nCountry: ${$("#co").value}\nAreas: ${ar}\nPreferred contact: ${$("#pc").value}\n\n${$("#ds").value}`;
st.style.borderColor="var(--olive)";st.innerHTML=`Your email app should now open with the enquiry drafted. <b>It has not been sent yet</b> — please press send there. If nothing opens, write to <a href="mailto:${EMAIL}">${EMAIL}</a> or use <a href="https://wa.me/${CFG.wa}">WhatsApp</a>.`;
location.href=`mailto:${EMAIL}?subject=${encodeURIComponent("Website enquiry — "+$("#nm").value)}&body=${encodeURIComponent(body)}`;/* TODO: if CFG.formEndpoint is set, POST here and show success only on a 2xx response */});}
$("#menu").innerHTML=NAV.map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join("")+`<li><a class="cta" href="#contact">Contact</a></li>`;
$("#mb").onclick=()=>{const o=$("#menu").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
$("#ft").innerHTML=`<div class="cols"><div><div class="serif" style="font-size:1.5rem;color:var(--ink)">Jugaad Advisory</div><div class="eyebrow">The Problem Solver</div><p>Every problem is different. Every solution should be too.</p></div><div>${NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join("")}<a href="#contact">Contact</a></div><div><a href="tel:+919820079484">${CFG.phone}</a><a href="mailto:${EMAIL}">${EMAIL}</a><a href="${CFG.url}">jugaadadvisory.com</a><a href="${CFG.linkedin}" rel="noopener">LinkedIn</a></div></div><p style="margin-top:30px">Jugaad Advisory is a brand of Guava Creative Solutions Private Limited. Jugaad Advisory provides advisory, coordination and facilitation services within agreed scopes. Specialist and regulated professional services are provided by appropriately qualified and authorised professionals. No particular commercial, legal, institutional or regulatory outcome is guaranteed.</p><p><a style="display:inline" href="#privacy">Privacy Policy</a> · <a style="display:inline" href="#terms">Terms</a></p>`;
addEventListener("hashchange",route);route();
</script></body></html>
